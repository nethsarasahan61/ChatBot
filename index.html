<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <center>
    <div class="card">
    <div class="chat-header">ChatBot</div>
        <div class="chat-window">
            <div style="display: flex; justify-content: flex-end;">
                <ul class="message-list-right" id="msg-list-right"></ul>
            </div>
            <div style="display: flex; justify-content: flex-start;">
                <ul class="message-list-left" id="msg-list-left"></ul>  
            </div>              
        </div>
        <div class="chat-input">
            <input type="text" class="message-input" placeholder="Type your message here" id="user-input">
            <input type="button" value="Send" onclick="sendBtn()" class="send-button" id="btn-Send">
        </div>
    </div>
    </center>

    <script src="js/app.js"></script>
</body>
</html>
